name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint • Type-check • Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual env and install package (with dev extras)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: uv run ruff check .
        continue-on-error: true   # research code released as-is; tests are the gate

      - name: Format check with ruff
        run: uv run ruff format --check .
        continue-on-error: true

      - name: Type-check with mypy
        run: uv run mypy src tests
        continue-on-error: true   # relaxed until the package has substantive code

      - name: Run pytest
        run: uv run pytest --cov=src --cov-report=term-missing
