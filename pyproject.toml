[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uhi-pipeline"
version = "0.0.0"
description = "Continuous Morphology Archetypes for Heat Mitigation Across Cities — companion pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Seyda Emekci", email = "semekci@aybu.edu.tr" },
  { name = "Hakan Emekci", email = "hakan.emekci@tedu.edu.tr" },
]
keywords = [
  "urban heat island",
  "urban morphology",
  "remote sensing",
  "machine learning",
  "shap",
  "multi-city",
  "climate-smart design",
  "building footprints",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

# Runtime dependencies pinned at install time once the pipeline lands;
# kept empty here so the package is installable from a fresh skeleton.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/hemekci/UHI"
Issues   = "https://github.com/hemekci/UHI/issues"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
