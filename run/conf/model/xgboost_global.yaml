# Single global XGBoost model with all features (including koppen_zone as categorical).

name: xgboost_global
kind: xgboost
per_zone: false

params:
  max_depth: 6
  learning_rate: 0.05
  n_estimators: 1500
  subsample: 0.85
  colsample_bytree: 0.8
  min_child_weight: 5
  reg_lambda: 1.0
  early_stopping_rounds: 100
  random_state: ${seed}
  n_jobs: -1

cv:
  kind: leave_one_city_out
  folds: 5

shap:
  compute: true
  explainer: tree
  top_k_features: 5
  top_k_interactions: 5
